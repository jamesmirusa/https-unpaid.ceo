<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101521">
  <meta name="description" content="Unpaid CEO: grow from a Bronx side hustle to a billion-dollar company and learn real business on the way.">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101521; overflow: hidden; touch-action: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #101521; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              gap: 28px; color: #F4F1FF; font: 600 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #logo { font-size: 42px; font-weight: 800; letter-spacing: 0.06em; }
    #logo span { color: #FF3EA5; }
    #tagline { opacity: 0.7; margin-top: -18px; text-align: center; padding: 0 24px; }
    #bar { width: min(320px, 70vw); height: 10px; border-radius: 6px; background: rgba(255,255,255,0.12); overflow: hidden; }
    #fill { width: 0%; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #F2C14E, #FF3EA5); transition: width 0.2s; }
    #error { display: none; max-width: 80vw; text-align: center; color: #FF8A8A; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <div id="logo">UNPAID <span>CEO</span></div>
    <div id="tagline">From the Bronx to a billion. Loading the city…</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="error"></div>
  </div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };
    createUnityInstance(canvas, config, function (p) {
      document.querySelector("#fill").style.width = Math.round(p * 100) + "%";
    }).then(function () {
      document.querySelector("#loader").style.display = "none";
    }).catch(function (message) {
      var e = document.querySelector("#error");
      e.textContent = "The game could not start: " + message;
      e.style.display = "block";
    });
  </script>
</body>
</html>
